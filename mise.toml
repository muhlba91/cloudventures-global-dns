min_version = "2026.10.0"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[tools]
actionlint = "1.7.12"
fnox = { version = "v1.50.0", workflow = "release.yml" }
"npm:markdownlint-cli2" = "0.24.2"
python = "3.15.2"
vault = "2.2.2"

[env]
_.python.venv = { path = ".venv", create = true }
